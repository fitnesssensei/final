<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Keitaro wrapper{% endblock %}</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1d2433; --muted: #68738a;
      --line: #dfe4ef; --accent: #3157d5; --accent-soft: #e8edff;
      --danger: #c0392b; --ok: #1f7a4c; --warn: #a86400;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.45;
    }
    a { color: var(--accent); }
    code { background: #eef1f7; padding: 1px 5px; border-radius: 5px; font-size: 0.9em; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 14px 28px; background: var(--card);
      border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
    }
    .brand { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
    .brand span { color: var(--accent); }
    nav { display: flex; gap: 8px; }
    nav a { padding: 7px 14px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 600; }
    nav a:hover { background: var(--accent-soft); color: var(--accent); }
    nav a.active { background: var(--accent); color: #fff; }
    main { max-width: 1120px; margin: 0 auto; padding: 28px 20px 56px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    h2 { margin: 0; font-size: 18px; }
    .page-head { margin-bottom: 20px; }
    .page-head p { margin: 0; color: var(--muted); }
    .alert {
      border-radius: 10px; padding: 12px 16px; margin-bottom: 18px;
      border: 1px solid transparent; font-weight: 500;
    }
    .alert-error { background: #fdecea; border-color: #f5c6c0; color: var(--danger); }
    .alert-ok { background: #e8f6ee; border-color: #bfe5cf; color: var(--ok); }
    .alert-warn { background: #fdf5e3; border-color: #f0d9a8; color: var(--warn); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 18px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, 0.8fr); gap: 18px; }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
    .form label { display: block; font-weight: 600; margin-bottom: 12px; }
    .form input, .form select, .inline select {
      width: 100%; margin-top: 5px; padding: 9px 11px;
      border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff;
    }
    .form input:focus, .form select:focus, .inline select:focus {
      outline: 2px solid var(--accent-soft); border-color: var(--accent);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }
    .hint { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: 1px solid var(--line); background: #fff; color: var(--text);
      border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600;
      cursor: pointer; text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: #2646b5; color: #fff; }
    .btn-danger { color: var(--danger); border-color: #ecc7c2; background: #fff7f6; }
    .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
    .btn-small { padding: 6px 10px; font-size: 13px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .inline select { width: auto; min-width: 240px; }
    .filters { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
    .filters label { font-weight: 600; font-size: 13px; color: var(--muted); }
    .filters select {
      display: block; margin-top: 4px; min-width: 190px; padding: 8px 10px;
      border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff;
    }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    @media (max-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }
    .metric { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
    .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    .metric .value { font-size: 22px; font-weight: 700; margin-top: 4px; overflow-wrap: anywhere; }
    .metric .value.small { font-size: 16px; }
    .stream-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .badge {
      display: inline-block; border-radius: 999px; padding: 3px 9px; font-size: 12px;
      background: var(--accent-soft); color: var(--accent); font-weight: 700;
    }
    .badge.muted { background: #eef1f7; color: var(--muted); }
    .badge.warn { background: #fff1d6; color: var(--warn); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-top: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
    tbody tr:first-child td { border-top: 0; }
    .num { font-variant-numeric: tabular-nums; font-weight: 700; }
    .weight {
      display: inline-block; min-width: 54px; text-align: center; padding: 3px 8px;
      border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 700;
    }
    .muted { color: var(--muted); }
    .empty { text-align: center; padding: 36px 20px; color: var(--muted); }
    .empty strong { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; }
    .aside-list { margin: 0; padding-left: 18px; color: var(--muted); }
    .aside-list li { margin-bottom: 8px; }
    footer { max-width: 1120px; margin: 0 auto; padding: 0 20px 30px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  {% set path = request.url.path %}
  <header class="topbar">
    <a class="brand" href="/ui/creator">Keitaro <span>wrapper</span></a>
    <nav>
      <a href="/ui/creator" {% if path.startswith('/ui/creator') %}class="active"{% endif %}>Создатель</a>
      <a href="/ui/editor" {% if path.startswith('/ui/editor') %}class="active"{% endif %}>Редактор</a>
      <a href="/health">Health</a>
    </nav>
  </header>
  <main>
    {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
    {% if notice %}<div class="alert alert-ok" role="status">{{ notice }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer>Keitaro Admin API wrapper · локальный инструмент, без авторизации</footer>
</body>
</html>
