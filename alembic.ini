[alembic]
# Каталог называется `migrations`, а не `alembic`: иначе локальный пакет
# затеняет установленный `alembic` для линтера и автодополнения.
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# URL задаётся в alembic/env.py: -x db_url=... → sqlalchemy.url → DATABASE_URL/.env → дефолт.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
